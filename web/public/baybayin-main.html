<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baybayin Translator</title>
    <!-- Base TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <!-- TFLite WebAssembly runtime -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/tf-tflite.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #000;
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title-overlay {
            position: absolute;
            top: 16px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .title-overlay h1 {
            display: inline-block;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .output-container {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 520px;
            padding: 16px 20px;
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .output-label {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .output-text {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            word-break: break-word;
            min-height: 32px;
        }
    </style>
</head>

<body>
    <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output-canvas"></canvas>

        <div class="title-overlay">
            <h1>Baybayin Translator</h1>
        </div>

        <div class="output-container">
            <div class="output-label">Detected Output</div>
            <div id="output-text" class="output-text">—</div>
        </div>
    </div>

    <script>
        const MODEL_DIM = 640;
        const CONFIDENCE_THRESHOLD = 0.25;

        const CLASSES = [
            "a", "b", "ba", "be_bi", "bo_bu", "d", "da", "de_di", "do_du", "e_i",
            "g", "ga", "ge_gi", "go_gu", "h", "ha", "he_hi", "ho_hu", "k", "ka",
            "ke_ki", "ko_ku", "l", "la", "le_li", "lo_lu", "m", "ma", "me_mi", "mo_mu",
            "n", "na", "ne_ni", "ng", "nga", "nge_ngi", "ngo_ngu", "no_nu", "o_u", "p",
            "pa", "pe_pi", "po_pu", "s", "sa", "se_si", "so_su", "t", "ta", "te_ti",
            "to_tu", "w", "wa", "we_wi", "wo_wu", "y", "ya", "ye_yi", "yo_yu"
        ];

        const COLORS = CLASSES.map(() => `white`);

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output-canvas');
        const outputText = document.getElementById('output-text');
        const ctx = canvas.getContext('2d');

        let model;
        let activeBoxes = [];

        async function init() {
            try {
                // 1. Point to the remote CDN hosting WASM dependencies
                tflite.setWasmPath('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/');

                // 2. Load the .tflite file directly
                model = await tflite.loadTFLiteModel('./baybayin-main/best_int8.tflite');
                console.log("TFLite Model loaded successfully");

                await setupCamera();
                video.play();

                renderLoop();
                inferenceLoop();
            } catch (error) {
                console.error("Error initializing:", error);
            }
        }

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    facingMode: 'environment'
                },
                audio: false
            });

            video.srcObject = stream;

            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 640;
                    resolve(video);
                };
            });
        }

        function sortBoxesInReadingOrder(boxes) {
            if (!boxes || boxes.length === 0) return [];

            const annotated = boxes.map(b => ({
                ...b,
                cx: (b.x1 + b.x2) / 2,
                cy: (b.y1 + b.y2) / 2,
                h: Math.abs(b.y2 - b.y1),
                w: Math.abs(b.x2 - b.x1)
            }));

            annotated.sort((a, b) => a.cy - b.cy);

            const lines = [];
            annotated.forEach(box => {
                const matchingLine = lines.find(line => {
                    const avgY = line.reduce((acc, curr) => acc + curr.cy, 0) / line.length;
                    const avgH = line.reduce((acc, curr) => acc + curr.h, 0) / line.length;
                    return Math.abs(box.cy - avgY) < avgH * 0.5;
                });

                if (matchingLine) {
                    matchingLine.push(box);
                } else {
                    lines.push([box]);
                }
            });

            lines.forEach(line => line.sort((a, b) => a.cx - b.cx));
            return lines.flat();
        }

        function updateOutputText(boxes) {
            if (!boxes || boxes.length === 0) {
                outputText.innerText = "—";
                return;
            }

            const sorted = sortBoxesInReadingOrder(boxes);
            outputText.innerText = sorted.map(b => CLASSES[b.classId]).join(' ');
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            activeBoxes.forEach(box => {
                const maxCoord = Math.max(Math.abs(box.x1), Math.abs(box.y1), Math.abs(box.x2), Math.abs(box.y2));
                const isNormalized = maxCoord <= 2.0;

                const scaleX = isNormalized ? canvas.width : (canvas.width / MODEL_DIM);
                const scaleY = isNormalized ? canvas.height : (canvas.height / MODEL_DIM);

                const x1 = box.x1 * scaleX;
                const y1 = box.y1 * scaleY;
                const x2 = box.x2 * scaleX;
                const y2 = box.y2 * scaleY;

                const renderX = Math.min(x1, x2);
                const renderY = Math.min(y1, y2);
                const renderW = Math.abs(x2 - x1);
                const renderH = Math.abs(y2 - y1);

                const color = COLORS[box.classId] || "#FFFFFF";
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.strokeRect(renderX, renderY, renderW, renderH);

                const label = `${CLASSES[box.classId]}`;
                ctx.fillStyle = color;
                ctx.font = "bold 14px sans-serif";
                const labelHeight = 20;
                ctx.fillRect(renderX, renderY - labelHeight, renderW, labelHeight);
                ctx.fillStyle = "#000000";
                ctx.textAlign = "center";
                const centerX = renderX + (renderW / 2);
                ctx.fillText(label, centerX, renderY - 6);
                ctx.textAlign = "left";
            });

            requestAnimationFrame(renderLoop);
        }

        async function inferenceLoop() {
            let inputTensor, predictions;

            try {
                inputTensor = tf.tidy(() => {
                    let img = tf.browser.fromPixels(video).resizeBilinear([MODEL_DIM, MODEL_DIM]);
                    
                    // NOTE: If your .tflite is full INT8/UINT8 quantized, comment out .div(255.0) and use .toInt() instead:
                    img = img.div(255.0); // Standard float32 normalization
                    
                    return img.expandDims(0);
                });

                // 3. TFLite model execution: use .predict() instead of .execute()
                let rawOutput = model.predict(inputTensor);
                predictions = Array.isArray(rawOutput) ? rawOutput[0] : (rawOutput instanceof tf.Tensor ? rawOutput : Object.values(rawOutput)[0]);

                const shape = predictions.shape;
                const data = await predictions.data();

                let boxes = [];

                // Format A: [1, num_boxes, 6] (Already NMS-filtered output)
                if (shape.length === 3 && shape[2] === 6) {
                    for (let i = 0; i < shape[1]; i++) {
                        const offset = i * 6;
                        const score = data[offset + 4];
                        if (score > CONFIDENCE_THRESHOLD) {
                            boxes.push({
                                x1: data[offset], y1: data[offset + 1],
                                x2: data[offset + 2], y2: data[offset + 3],
                                score: score, classId: Math.round(data[offset + 5])
                            });
                        }
                    }
                }
                // Format B: [1, 4 + classes, anchors] (Standard raw YOLOv8 output)
                else if (shape.length === 3 && shape[1] === (4 + CLASSES.length)) {
                    const numAnchors = shape[2];
                    for (let i = 0; i < numAnchors; i++) {
                        let localMaxScore = 0;
                        let classId = -1;
                        for (let c = 0; c < CLASSES.length; c++) {
                            const score = data[(4 + c) * numAnchors + i];
                            if (score > localMaxScore) { localMaxScore = score; classId = c; }
                        }
                        if (localMaxScore > CONFIDENCE_THRESHOLD) {
                            const cx = data[0 * numAnchors + i];
                            const cy = data[1 * numAnchors + i];
                            const w = data[2 * numAnchors + i];
                            const h = data[3 * numAnchors + i];
                            boxes.push({
                                x1: cx - w / 2, y1: cy - h / 2,
                                x2: cx + w / 2, y2: cy + h / 2,
                                score: localMaxScore, classId: classId
                            });
                        }
                    }
                    if (boxes.length > 0) {
                        const tfBoxes = tf.tensor2d(boxes.map(b => [b.y1, b.x1, b.y2, b.x2]));
                        const tfScores = tf.tensor1d(boxes.map(b => b.score));
                        const nmsIndices = await tf.image.nonMaxSuppressionAsync(tfBoxes, tfScores, 50, 0.45, CONFIDENCE_THRESHOLD);
                        const indices = await nmsIndices.data();
                        boxes = Array.from(indices).map(idx => boxes[idx]);
                        tf.dispose([tfBoxes, tfScores, nmsIndices]);
                    }
                }

                activeBoxes = boxes;
                updateOutputText(boxes);

            } catch (err) {
                console.error("Inference Error:", err);
            } finally {
                if (inputTensor) inputTensor.dispose();
                if (predictions && typeof predictions.dispose === 'function') predictions.dispose();
            }

            setTimeout(inferenceLoop, 250);
        }

        init();
    </script>
</body>

</html>
